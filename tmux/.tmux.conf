bind l source-file ~/.tmux.conf \; display "Reloaded!"
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind t new-window
bind -n C-S-f next-window
bind -n C-S-d previous-window
bind p resize-pane -Z

set-option -g prefix C-b
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g focus-events on
set -g history-limit 50000
set -g set-titles-string "#W"

# Automatically set window title
 set-window-option -g automatic-rename off
 set-option -g set-titles on

bind u split-window -hc "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind i split-window -vc "#{pane_current_path}" -p 30
bind _ split-window -fv -c "#{pane_current_path}"

bind -r n resize-pane -L 5
bind -r m resize-pane -D 5
bind -r , resize-pane -U 5
bind -r . resize-pane -R 5


# Clipboard bridging (Windows <-> WSL2)
set -s copy-command 'win32yank.exe -i --crlf'
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'

set-option -g mouse on
# make scrolling with wheels work
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M


# Launch pr-monitor in a new window
bind g new-window -n "pr-monitor" "pr-monitor"

# Fuzzy Claude session switcher
bind f display-popup -E -w 90% -h 60% "$HOME/bin/claude-switch"

# Quick window title shortcuts
bind S rename-window "ship-it"
bind P rename-window "pr"

# Allow OSC passthrough to outer terminal (needed for pr-monitor toast notifications)
set -g allow-passthrough on

set-option -g status-position bottom
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_pane_active_border_style "fg=#89b4fa,bold"
set -g @catppuccin_pane_border_style "fg=colour238"
set -g @plugin 'christoomey/vim-tmux-navigator'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Fully transparent background (both active and inactive panes)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# Clear catppuccin status-left/right — layout is fully owned by status-format
set -g status-left ""
set -g status-right ""
# Set base status bar colors explicitly (catppuccin only sets status-bg, not status-style)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Active pane: bright blue border. Inactive: dim.
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g pane-border-style 'fg=colour238'
setw -g pane-border-status off

# 2-row tab bar: row 0 = index + ticket/name, row 1 = project dir aligned under each tab
# Cell width: 1 + p2(index) + 1 + p12(name) + 1 = 17 chars — identical in both rows
set -g status 2
set -g status-format[0] "#[align=left]#{W:#[bg=#1e1e2e]#[fg=#a6adc8] #{p2:window_index} #{p12:#{=12:window_name}} ,#[bg=colour99]#[fg=colour255]#[bold] #{p2:window_index} #{p12:#{=12:window_name}} }"
set -g status-format[1] "#{W:#[bg=#1e1e2e]#[fg=#9399b2] #{p15:#{=15:#{s/-/ /g:#{s/stark-//:#{b:pane_current_path}}}}} ,#[bg=#1e1e2e]#[fg=#89b4fa] #{p15:#{=15:#{s/-/ /g:#{s/stark-//:#{b:pane_current_path}}}}} }"
