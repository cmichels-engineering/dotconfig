bind l source-file ~/.tmux.conf \; display "Reloaded!"
bind r command-prompt -I "#{window_name}" "rename-window '%%'"
bind t new-window
bind -n C-S-f next-window
bind -n C-S-d previous-window
bind p resize-pane -Z

set-option -g prefix C-b
set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g focus-events on
set -g history-limit 50000
set -g set-titles-string "#W"

# Automatically set window title
 set-window-option -g automatic-rename off
 set-option -g set-titles on

bind u split-window -hc "#{pane_current_path}"
bind "\\" split-window -fh -c "#{pane_current_path}"
bind i split-window -vc "#{pane_current_path}" -p 30
bind _ split-window -fv -c "#{pane_current_path}"

bind -r n resize-pane -L 5
bind -r m resize-pane -D 5
bind -r , resize-pane -U 5
bind -r . resize-pane -R 5


# Clipboard bridging (Windows <-> WSL2)
set -s copy-command 'win32yank.exe -i --crlf'
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'win32yank.exe -i --crlf'

set-option -g mouse on
# make scrolling with wheels work
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M


# Launch pr-monitor in a new window
bind g new-window -n "pr-monitor" "pr-monitor"

# Toggle PR review session (prefix+G toggles between main and pr-review)
bind G if-shell "[ '#{session_name}' = 'pr-review' ]" "switch-client -l" "switch-client -t pr-review"

# Fuzzy Claude session switcher
bind f display-popup -E -w 90% -h 60% "$HOME/bin/claude-switch"

# Quick window title shortcuts
bind S rename-window "ship-it"
bind P rename-window "pr"

# Toggle Claude silence monitoring on current window (prefix+C)
# Uses @claude-silence-timeout (default 60s). Rainbow highlights silent Claude tabs.
bind C run-shell ' \
  timeout=$(tmux show-option -gqv @claude-silence-timeout); \
  timeout=${timeout:-60}; \
  current=$(tmux show-window-option -qv monitor-silence); \
  if [ "${current:-0}" = "0" ]; then \
    tmux set-window-option monitor-silence "$timeout"; \
    tmux display-message "Claude mode ON (${timeout}s)"; \
  else \
    tmux set-window-option monitor-silence 0; \
    tmux display-message "Claude mode OFF"; \
  fi \
'

# Allow OSC passthrough to outer terminal (needed for pr-monitor toast notifications)
set -g allow-passthrough on

set-option -g status-position bottom
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

# Resurrect: save pane contents and restore on restart
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 10 min, auto-restore on tmux start
set -g @continuum-save-interval '10'
set -g @continuum-restore 'on'

# Claude silence: off globally — toggle per-window with prefix+C
# Only windows explicitly toggled into Claude mode get silence detection + rainbow
set-option -g monitor-silence 0
set-option -g visual-silence off
set -g @claude-silence-timeout 60
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_pane_active_border_style "fg=#89b4fa,bold"
set -g @catppuccin_pane_border_style "fg=colour238"
set -g @plugin 'christoomey/vim-tmux-navigator'
# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Fully transparent background (both active and inactive panes)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# Clear catppuccin status-left/right — layout is fully owned by status-format
set -g status-left ""
set -g status-right ""
# Set base status bar colors explicitly (catppuccin only sets status-bg, not status-style)
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Active pane: bright blue border. Inactive: dim.
set -g pane-active-border-style 'fg=#89b4fa,bold'
set -g pane-border-style 'fg=colour238'
setw -g pane-border-status off

# 2-row tab bar: row 0 = index + ticket/name, row 1 = project dir aligned under each tab
# Cell width: 1 + p2(index) + 1 + p12(name) + 1 = 17 chars — identical in both rows
set -g status 2
# Rainbow palette: catppuccin mocha — red peach yellow green teal blue lavender mauve
# Silent Claude windows (prefix+C toggled) get per-tab rainbow fg, bold text
# Normal windows are unchanged; active window keeps purple highlight
set -g status-format[0] "#[align=left]#{W:#{?window_silence_flag,#[bg=#1e1e2e]#{?#{==:#{window_index},0},#[fg=#f38ba8],#{?#{==:#{window_index},1},#[fg=#fab387],#{?#{==:#{window_index},2},#[fg=#f9e2af],#{?#{==:#{window_index},3},#[fg=#a6e3a1],#{?#{==:#{window_index},4},#[fg=#94e2d5],#{?#{==:#{window_index},5},#[fg=#89b4fa],#{?#{==:#{window_index},6},#[fg=#b4befe],#[fg=#cba6f7]}}}}}}}#[bold] #{p2:window_index} #{p12:#{=12:window_name}} #[nobold],#[bg=#1e1e2e]#[fg=#a6adc8] #{p2:window_index} #{p12:#{=12:window_name}} },#[bg=colour99]#[fg=colour255]#[bold] #{p2:window_index} #{p12:#{=12:window_name}} }"
set -g status-format[1] "#{W:#{?window_silence_flag,#[bg=#1e1e2e]#{?#{==:#{window_index},0},#[fg=#f38ba8],#{?#{==:#{window_index},1},#[fg=#fab387],#{?#{==:#{window_index},2},#[fg=#f9e2af],#{?#{==:#{window_index},3},#[fg=#a6e3a1],#{?#{==:#{window_index},4},#[fg=#94e2d5],#{?#{==:#{window_index},5},#[fg=#89b4fa],#{?#{==:#{window_index},6},#[fg=#b4befe],#[fg=#cba6f7]}}}}}}}#[bold] #{p15:#{=15:#{s/-/ /g:#{s/stark-//:#{b:pane_current_path}}}}} #[nobold],#[bg=#1e1e2e]#[fg=#9399b2] #{p15:#{=15:#{s/-/ /g:#{s/stark-//:#{b:pane_current_path}}}}} },#[bg=#1e1e2e]#[fg=#89b4fa] #{p15:#{=15:#{s/-/ /g:#{s/stark-//:#{b:pane_current_path}}}}} }"
